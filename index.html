<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Mis 50 Años - Lau</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Decoración de fondo: pétalos -->
  <div class="petals" id="petals"></div>

  <div class="container">
    <!-- Imagen temática (la invitación de rosas con "Mis 50 Años - Lau") -->
    <div class="theme-image" id="themeImage">
      <!-- La imagen se carga dinámicamente desde config.js -->
    </div>

    <!-- Encabezado -->
    <div class="header">
      <h1 class="title" id="titulo"></h1>
      <h2 class="subtitle" id="subtitulo"></h2>
    </div>

    <!-- Tarjeta con marco dorado -->
    <div class="invitation-card">

      <!-- Información del evento -->
      <div class="event-info">
        <div class="info-row">
          <span class="info-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="5" width="18" height="16" rx="2" stroke="#f9f1e2" stroke-width="1.4" />
              <line x1="3" y1="9" x2="21" y2="9" stroke="#f9f1e2" stroke-width="1.4" />
              <line x1="8" y1="3" x2="8" y2="7" stroke="#f9f1e2" stroke-width="1.4" stroke-linecap="round" />
              <line x1="16" y1="3" x2="16" y2="7" stroke="#f9f1e2" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </span>
          <span class="info-text">
            Fecha
            <strong id="fecha">[Fecha del evento]</strong>
          </span>
        </div>

        <div class="info-row">
          <span class="info-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21Z" stroke="#f9f1e2"
                stroke-width="1.4" stroke-linejoin="round" />
              <circle cx="12" cy="9.5" r="2.3" stroke="#f9f1e2" stroke-width="1.4" />
            </svg>
          </span>
          <span class="info-text">
            Lugar
            <strong id="lugar">[Nombre del salón / lugar]</strong>
            <small id="direccion">[Dirección completa]</small>
          </span>
        </div>

        <div class="info-row">
          <span class="info-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="9" stroke="#f9f1e2" stroke-width="1.4" />
              <path d="M12 7v5l3.5 2" stroke="#f9f1e2" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </span>
          <span class="info-text">
            Horario
            <strong id="hora">[Hora]</strong>
          </span>
        </div>
      </div>

      <!-- Separador -->
      <div class="separator">
        <svg class="separator-rose" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="7" fill="url(#roseGradSep)" />
          <circle cx="24" cy="24" r="3.2" fill="#f6e6d8" />
          <path d="M24 10 C20 14, 20 18, 24 20 C28 18, 28 14, 24 10Z" fill="url(#roseGradSep)" opacity="0.85" />
          <path d="M24 38 C20 34, 20 30, 24 28 C28 30, 28 34, 24 38Z" fill="url(#roseGradSep)" opacity="0.85" />
          <path d="M10 24 C14 20, 18 20, 20 24 C18 28, 14 28, 10 24Z" fill="url(#roseGradSep)" opacity="0.85" />
          <path d="M38 24 C34 20, 30 20, 28 24 C30 28, 34 28, 38 24Z" fill="url(#roseGradSep)" opacity="0.85" />
          <defs>
            <linearGradient id="roseGradSep" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#8a1c2b" />
              <stop offset="100%" stop-color="#b8455a" />
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- Contador regresivo -->
      <div class="countdown-section">
        <h3 class="countdown-title">Faltan</h3>
        <div class="countdown" id="countdown">
          <div class="time-box" id="daysBox">
            <div class="time-number" id="days">00</div>
            <div class="time-label">Días</div>
          </div>
          <div class="time-box" id="hoursBox">
            <div class="time-number" id="hours">00</div>
            <div class="time-label">Horas</div>
          </div>
          <div class="time-box" id="minutesBox">
            <div class="time-number" id="minutes">00</div>
            <div class="time-label">Min</div>
          </div>
          <div class="time-box" id="secondsBox">
            <div class="time-number" id="seconds">00</div>
            <div class="time-label">Seg</div>
          </div>
        </div>
      </div>

      <!-- Botones de acción -->
      <div class="buttons">
        <a href="#" target="_blank" class="btn btn-location" id="btnMaps">
          <span class="btn-text" id="textoBotonMaps">Ver ubicación</span>
        </a>

        <a href="#" target="_blank" class="btn btn-whatsapp" id="btnWhatsapp">
          <span class="btn-text" id="textoBotonWhatsApp">Confirmar asistencia</span>
        </a>
      </div>

    </div>

    <!-- Footer -->
    <div class="footer" id="mensajeFinal">
      Cincuenta años de historias, risas y aprendizajes que hoy se celebran en una noche para atesorar.
    </div>
  </div>

  <!-- Botón de música flotante -->
  <button id="musicControl" class="music-control" title="Música">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M11 5L6 9H2v6h4l5 4V5z" stroke="#8a1c2b" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke="#8a1c2b" stroke-width="1.5" stroke-linecap="round" />
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14" stroke="#8a1c2b" stroke-width="1.5" stroke-linecap="round" />
    </svg>
  </button>

  <!-- Elemento de audio -->
  <audio id="backgroundMusic" loop>
    <source id="musicSource" src="" type="audio/mpeg">
    Tu navegador no soporta el elemento de audio.
  </audio>

  <!-- Archivos JavaScript -->
  <script src="config.js?v=2.0"></script>
  <script src="script.js?v=2.0"></script>
</body>

</html>
